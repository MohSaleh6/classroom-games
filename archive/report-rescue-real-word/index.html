<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Report Rescue: Save the School Magazine!</title>
<meta name="description" content="A Grade 7 Microsoft Word mission game: repair and finish a school magazine report in five missions.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=JetBrains+Mono:wght@500;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="tb-row">
    <button class="logo" id="logoBtn" type="button" aria-label="Go to mission HQ"><span class="mark">📰</span> Report Rescue</button>
    <span class="pill" id="clockPill" title="Time since you started (lesson is 45 minutes)" hidden>⏱ <b id="clock">0:00</b></span>
    <span class="pill" id="ptsPill" title="Points you claimed. Your teacher checks them." hidden>⭐ <b id="pts">0</b>/<span id="ptsMax">100</span></span>
    <button class="tbtn" id="reportBtn" type="button" hidden>📄 Report</button>
  </div>
  <nav class="tracker" id="tracker" aria-label="Mission progress" hidden></nav>
</header>

<main id="app"><noscript>Please turn on JavaScript to play Report Rescue.</noscript></main>

<div class="modal" id="modal" hidden><div class="modal-card" role="dialog" aria-modal="true" id="modalCard"></div></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
