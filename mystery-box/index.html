<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0820">
<title>Mystery Box: Ms Rahaf’s Word Challenge!</title>
<meta name="description" content="Ms Rahaf’s Grade 7 Word challenge: open 6 mystery boxes in 10 minutes, do each task in Microsoft Word and build your robot.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="glow g1"></i><i class="glow g2"></i><i class="glow g3"></i><i class="floor"></i></div>
<header class="top" id="top">
  <div class="brand"><span class="brand-box" aria-hidden="true"></span><span><b>Mystery Box</b><small>Ms Rahaf’s Word Challenge</small></span></div>
  <div class="top-tools">
    <span class="pill clock" id="clockPill" hidden aria-label="Time left">⏱ <b id="clock">10:00</b></span>
    <span class="pill stars" id="starPill" hidden aria-live="polite">⭐ <b id="starCount">0</b>/6</span>
    <button class="tbtn" id="starterBtn" type="button" hidden>📋 <span>Starter text</span></button>
    <button class="tbtn" id="supportBtn" type="button" aria-pressed="false">🤝 <span>Support</span></button>
    <button class="tbtn icon" id="soundBtn" type="button" aria-pressed="true" aria-label="Sound">🔊</button>
  </div>
</header>
<main id="app"><noscript>Please turn on JavaScript to play Mystery Box: Word Challenge!</noscript></main>
<footer class="foot" id="foot"><button class="linkbtn" id="teacherBtn" type="button">👩‍🏫 Teacher</button></footer>
<div class="layer" id="layer" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
